services:
  postgres:
    image: postgres:16-alpine
    container_name: ecci_finanzas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-finanzas_personales_db}
      POSTGRES_USER: ${DB_USER:-finanzas_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finanzas_pass_2026}
      TZ: America/Bogota
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata_finanzas:/var/lib/postgresql/data
      - ./PERSISTENCIA/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finanzas_user} -d ${DB_NAME:-finanzas_personales_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_finanzas:
